ekf_filter_node:
  ros__parameters:
    use_sim_time: true
    frequency: 30.0
    two_d_mode: true
    publish_tf: true

    map_frame: map
    odom_frame: odom
    base_link_frame: base_footprint
    world_frame: odom

    # -------------------------------------------------------------
    # 1. Wheel Odometry Configuration
    # -------------------------------------------------------------
    odom0: /odom
    odom0_config: [false, false, false,
                   false, false, false,
                   true,  false, false,
                   false, false, false,
                   false, false, false]
    odom0_queue_size: 10
    odom0_differential: false
    odom0_relative: false

    # -------------------------------------------------------------
    # 2. IMU Configuration
    # -------------------------------------------------------------
    imu0: /imu
    imu0_config: [false, false, false,
                  false, false, true,    # Orientation (Yaw)
                  false, false, false,
                  false, false, true,    # Angular velocity (wz)
                  false, false, false]
    imu0_differential: false
    imu0_relative: false
    imu0_queue_size: 10
    imu0_remove_gravitational_acceleration: true

    # Use 6-element diagonal entries instead of 36 elements:
    imu0_pose_covariance_diagonal: [0.01, 0.01, 0.01, 0.01, 0.01, 0.01]
    imu0_twist_covariance_diagonal: [0.01, 0.01, 0.01, 0.01, 0.01, 0.01]
    odom0_pose_covariance_diagonal: [0.01, 0.01, 0.01, 0.01, 0.01, 0.01]
    odom0_twist_covariance_diagonal: [0.01, 0.01, 0.01, 0.01, 0.01, 0.01]